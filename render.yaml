services:
  - type: web
    name: pulse-ml-service
    env: python
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt && python train_models.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    
  - type: web
    name: pulse-node-backend
    env: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PYTHON_SERVICE_URL
        value: https://pulse-ml-service.onrender.com/predict # Update this after the ML service deploys
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGIN
        value: "*"
